name: verify

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -U pip pytest
      - name: Compile
        run: python -m compileall morph_core tests
      - name: Test
        run: python -m pytest -q
      - name: Run Experiment 028
        run: python -m morph_core.experiment028
      - name: Run Experiment 029
        run: python -m morph_core.experiment029
      - name: Run Experiment 030
        run: python -m morph_core.experiment030
      - name: Run Experiment 031
        run: python -m morph_core.experiment031
      - name: Run Experiment 032
        run: python -m morph_core.experiment032
      - name: Run Experiment 033
        run: python -m morph_core.experiment033
      - name: Run Experiment 034
        run: python -m morph_core.experiment034
      - name: Run Experiment 035
        run: python -m morph_core.experiment035
      - name: Run Experiment 036
        run: python -m morph_core.experiment036
      - name: Run Experiment 037
        run: python -m morph_core.experiment037
      - name: Run Experiment 038
        run: python -m morph_core.experiment038
      - name: Run Experiment 039
        run: python -m morph_core.experiment039
      - name: Run Experiment 040
        run: python -m morph_core.experiment040
      - name: Run Experiment 041
        run: python -m morph_core.experiment041
      - name: Run Experiment 042
        run: python -m morph_core.experiment042
      - name: Run Experiment 043
        run: python -m morph_core.experiment043
      - name: Run Experiment 043b
        run: python -m morph_core.experiment043b
      - name: Run Experiment 043c
        env:
          MORPHS_043C_AUTHORIZATION: ALLOW
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m morph_core.experiment043c_host
      - name: Upload Experiment 043c runtime receipt
        uses: actions/upload-artifact@v4
        with:
          name: morphs-043c-runtime-receipt
          path: experiments/043c/runtime_receipt.json
          if-no-files-found: error
