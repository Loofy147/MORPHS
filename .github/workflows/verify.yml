name: verify

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -U pip pytest
      - name: Compile
        run: python -m compileall morph_core tests
      - name: Test
        run: python -m pytest -q
      - name: Run current experiment
        run: python -m morph_core.experiment028
